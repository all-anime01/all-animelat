<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas de Anime - All-anime</title>
    <link rel="shortcut icon" href="image/logo.ico">
    <link rel="stylesheet" href="css/index-css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <header class="scrolled">
        <a href="index.html" class="logo">
            <img src="logo-all-anime.svg" alt="All-Anime Logo" class="logo-desktop">
            <img src="image/all-anime-logo.png" alt="All-Anime Logo Mobile" class="logo-mobile">
        </a>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="explorar.html">Explorar</a></li>
                <li><a class="active" href="peliculas.html">Películas</a></li>
                </ul>
        </nav>
        <div class="header-right">
            <div class="search-container">
                <i class="fas fa-search search-icon" id="search-icon-toggle"></i>
                <input type="text" placeholder="Buscar..." id="search-input">
                <div id="search-results" class="search-results-dropdown"></div>
            </div>
            <div id="menu-icon" class="fas fa-bars"></div>
        </div>
    </header>

    <main class="main-content container">
        <div class="page-header">
            <div class="page-header-controls">
                <h1>Películas de Anime</h1>
                <button id="toggle-filters-btn" class="action-btn"><i class="fas fa-filter"></i> Filtros</button>
            </div>
        </div>

        <section class="filters-section">
            <div class="filter-group search-filter">
                <input type="text" id="explore-search" placeholder="Buscar película...">
            </div>
            <div class="filter-group">
                <label>Géneros</label>
                <div class="genre-buttons" id="genre-filter-buttons">
                </div>
            </div>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="year-select">Año</label>
                    <select id="year-select" class="filter-select">
                    </select>
                </div>
                <div class="filter-group">
                    <label for="status-select">Estado</label>
                    <select id="status-select" class="filter-select">
                        <option value="all">Todos los estados</option>
                        <option value="En emisión">En emisión</option>
                        <option value="Finalizado">Finalizado</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="anime-listing-section">
            <div class="anime-grid" id="peliculas-anime-grid">
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p><span>Anime HD Online</span> - Ningún vídeo se encuentra alojado en nuestros servidores.</p>
            <nav class="footer-nav">
                <a href="#">Términos y Condiciones</a>
                <a href="#">Política de Privacidad</a>
                <a href="#">Sobre all-anime</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="module" src="js/main-2025.js"></script>
    <!-- Adsterra (Social Bar + Popunder) — sólo si el usuario NO compró "sin publicidad" -->
    <script>
    (function(){try{var v=localStorage.getItem("aa_adfree");if(v==="1"||(v&&Date.now()<parseInt(v,10)))return;}catch(e){}
    document.write('<script src="//temptedrecognise.com/cf/a6/75/cfa675a2a58c7c2c579b07801b66706f.js"><\/script>');
    document.write('<script src="//temptedrecognise.com/b6/9b/2a/b69b2a93a6ad48947bfeea27f00c50c8.js"><\/script>');})();
    </script>
</body>

</html>
