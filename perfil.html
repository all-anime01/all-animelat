<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil — All-Anime</title>
    <link rel="shortcut icon" href="image/logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --primary: #ca3030; --bg: #101010; --card: #202020; --text: #f0f0f0; --grey: #a0a0a0; --border: #303030; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Roboto, system-ui, sans-serif; background: radial-gradient(circle at top, #1b1b1b, var(--bg) 60%); color: var(--text); min-height: 100vh; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; }
        .topbar .logo img { height: 34px; }
        .topbar a { color: var(--grey); text-decoration: none; font-size: 14px; }
        .topbar a:hover { color: var(--text); }
        .wrap { max-width: 680px; margin: 10px auto 60px; padding: 0 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 26px; margin-bottom: 20px; }
        .profile-head { display: flex; align-items: center; gap: 20px; }
        .avatar-big { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; background: #161616; flex: none; }
        .profile-head h2 { font-size: 22px; margin-bottom: 4px; }
        .profile-head .email { color: var(--grey); font-size: 14px; word-break: break-all; }
        .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 20px; margin-top: 7px; }
        .badge.ok { background: rgba(0,170,80,.18); color: #4ade80; }
        .badge.no { background: rgba(202,48,48,.18); color: #ff7a7a; }
        h3 { font-size: 15px; margin-bottom: 14px; color: var(--grey); text-transform: uppercase; letter-spacing: .5px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 12px; }
        .avatar-grid img { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 3px solid transparent; background: #161616; transition: .15s; }
        .avatar-grid img:hover { transform: scale(1.06); }
        .avatar-grid img.selected { border-color: var(--primary); }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: var(--grey); margin-bottom: 6px; }
        input[type=text] { width: 100%; padding: 11px 13px; background: #161616; border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; }
        input:focus { outline: none; border-color: var(--primary); }
        .btn { background: var(--primary); color: #fff; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn.grey { background: #333; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .msg { font-size: 14px; margin-top: 12px; min-height: 18px; }
        .msg.ok { color: #4ade80; } .msg.error { color: #ff6b6b; }
        .theme-switch { display: flex; gap: 10px; }
        .theme-opt { flex: 1; text-align: center; padding: 14px; border-radius: 12px; border: 2px solid var(--border); cursor: pointer; font-weight: 600; }
        .theme-opt.active { border-color: var(--primary); }
        .theme-opt .dot { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 8px; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--border); }
        .settings-row:first-of-type { border-top: none; }
        .fav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .fav-tab { background: var(--card2, #161616); border: 1px solid var(--border); color: var(--grey); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .fav-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .fav-a { text-decoration: none; color: var(--text); }
        .fav-a img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 10px; background: #222; }
        .fav-a span { display: block; font-size: 12px; margin-top: 6px; line-height: 1.3; }
        .fav-ep { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
        .fav-ep img { width: 92px; height: 52px; object-fit: cover; border-radius: 8px; background: #222; flex: none; }
        .fav-ep b { font-size: 14px; } .fav-ep small { color: var(--grey); font-size: 12px; }
        .fav-empty { color: var(--grey); font-size: 14px; padding: 8px 0; }
        .notif-count { background: var(--primary); color: #fff; font-size: 12px; padding: 1px 9px; border-radius: 20px; margin-left: 6px; vertical-align: middle; }
        .notif-new { background: var(--primary); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 8px; font-weight: 700; letter-spacing: .5px; }
        .gate { text-align: center; padding: 90px 20px; }
        .gate a { color: #ff6b6b; }
        .admin-link { display: inline-flex; align-items: center; gap: 8px; }
    </style>
</head>

<body>
    <div class="topbar">
        <a href="index.html" class="logo"><img src="logo-all-anime.svg" alt="All-Anime"></a>
        <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </div>

    <div id="gate" class="gate">Cargando…</div>

    <div class="wrap" id="app" style="display:none">
        <!-- Cabecera del perfil -->
        <div class="card">
            <div class="profile-head">
                <img id="avatar-big" class="avatar-big" alt="Avatar">
                <div>
                    <h2 id="p-name">—</h2>
                    <p class="email" id="p-email">—</p>
                    <div id="verify-box"></div>
                </div>
            </div>
        </div>

        <!-- Mis favoritos -->
        <div class="card">
            <h3><i class="fas fa-heart"></i> Mis favoritos</h3>
            <div class="fav-tabs">
                <button class="fav-tab active" data-fav="animes">Animes</button>
                <button class="fav-tab" data-fav="episodes">Episodios</button>
            </div>
            <div id="fav-animes" class="fav-panel"></div>
            <div id="fav-episodes" class="fav-panel" style="display:none"></div>
        </div>

        <!-- Historial -->
        <div class="card">
            <h3><i class="fas fa-clock-rotate-left"></i> Historial</h3>
            <div id="history-list"><p class="fav-empty">Cargando…</p></div>
        </div>

        <!-- Notificaciones -->
        <div class="card">
            <h3><i class="fas fa-bell"></i> Notificaciones <span id="notif-count" class="notif-count"></span></h3>
            <div id="notif-list"><p class="fav-empty">Cargando…</p></div>
        </div>

        <!-- Avatar -->
        <div class="card">
            <h3><i class="fas fa-user-astronaut"></i> Elige tu avatar</h3>
            <div class="avatar-grid" id="avatar-grid"></div>
        </div>

        <!-- Nombre -->
        <div class="card">
            <h3><i class="fas fa-id-card"></i> Nombre de usuario</h3>
            <div class="field"><input type="text" id="name-input" maxlength="40" placeholder="Tu nombre"></div>
            <button class="btn" id="save-profile">Guardar cambios</button>
            <div class="msg" id="profile-msg"></div>
        </div>

        <!-- Configuración -->
        <div class="card">
            <h3><i class="fas fa-gear"></i> Configuración</h3>
            <div style="margin-bottom:18px">
                <label>Tema de la página</label>
                <div class="theme-switch">
                    <div class="theme-opt" data-theme="dark-theme"><div class="dot" style="background:#101010;border:1px solid #444"></div>Oscuro</div>
                    <div class="theme-opt" data-theme="red-theme"><div class="dot" style="background:#ca3030"></div>Rojo</div>
                </div>
            </div>
            <div class="settings-row" id="admin-row" style="display:none">
                <span><i class="fas fa-gauge-high"></i> Panel de administración</span>
                <a class="btn admin-link" href="admin/index.html">Abrir</a>
            </div>
            <div class="settings-row">
                <span>Cerrar sesión en este dispositivo</span>
                <button class="btn grey" id="logout-btn"><i class="fas fa-right-from-bracket"></i> Salir</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { observeAuth, logoutUser, updateUserProfile, resendVerification, isAdmin } from "./js/auth.js";
        import { AVATARS } from "./js/avatars.js";
        import { FIREBASE_CONFIGURED } from "./js/firebase-config.js";
        import { listFavAnimes, listFavEpisodes, listHistory } from "./js/user-data.js";
        import { getAnimeData } from "./js/data-provider.js";

        const $ = (id) => document.getElementById(id);
        let currentUser = null;
        let selectedAvatar = null;

        // ---- Tema (persistente, igual que main-2025.js) ----
        function applyThemeClass(theme) {
            document.body.classList.toggle("red-theme", theme === "red-theme");
            document.querySelectorAll(".theme-opt").forEach((o) =>
                o.classList.toggle("active", o.dataset.theme === (theme || "dark-theme")));
        }
        applyThemeClass(localStorage.getItem("theme") || "dark-theme");
        document.querySelectorAll(".theme-opt").forEach((opt) => opt.addEventListener("click", () => {
            const theme = opt.dataset.theme;
            localStorage.setItem("theme", theme);
            applyThemeClass(theme);
        }));

        // ---- Galería de avatares ----
        function buildAvatarGrid() {
            $("avatar-grid").innerHTML = AVATARS.map((url) =>
                `<img src="${url}" loading="lazy" data-url="${url}" alt="avatar">`).join("");
            $("avatar-grid").querySelectorAll("img").forEach((img) => img.addEventListener("click", () => {
                selectedAvatar = img.dataset.url;
                $("avatar-big").src = selectedAvatar;
                $("avatar-grid").querySelectorAll("img").forEach((i) => i.classList.remove("selected"));
                img.classList.add("selected");
            }));
        }

        function markSelected(url) {
            $("avatar-grid").querySelectorAll("img").forEach((i) =>
                i.classList.toggle("selected", i.dataset.url === url));
        }

        function renderVerify(user) {
            const box = $("verify-box");
            if (user.emailVerified) {
                box.innerHTML = '<span class="badge ok"><i class="fas fa-circle-check"></i> Correo verificado</span>';
            } else {
                box.innerHTML = `<span class="badge no"><i class="fas fa-circle-exclamation"></i> Correo sin verificar</span>
                    <div class="row" style="margin-top:8px">
                        <button class="btn grey" id="resend-btn" style="padding:7px 12px;font-size:13px">Reenviar correo</button>
                        <button class="btn grey" id="reload-btn" style="padding:7px 12px;font-size:13px">Ya verifiqué</button>
                    </div><div class="msg" id="verify-msg"></div>`;
                $("resend-btn").addEventListener("click", async () => {
                    try { await resendVerification(); $("verify-msg").textContent = "✅ Correo de verificación enviado."; $("verify-msg").className = "msg ok"; }
                    catch (e) { $("verify-msg").textContent = "❌ " + e.message; $("verify-msg").className = "msg error"; }
                });
                $("reload-btn").addEventListener("click", () => location.reload());
            }
        }

        // ---- Estado de sesión ----
        if (!FIREBASE_CONFIGURED) {
            $("gate").innerHTML = "⚠ Falta configurar Firebase en js/firebase-config.js";
        }

        observeAuth((user) => {
            if (!user) {
                $("gate").innerHTML = 'Inicia sesión para ver tu perfil. <a href="cuenta.html?redirect=perfil.html">Ir al login</a>';
                $("app").style.display = "none";
                return;
            }
            currentUser = user;
            $("gate").style.display = "none";
            $("app").style.display = "block";
            buildAvatarGrid();
            $("p-name").textContent = user.displayName || user.email.split("@")[0];
            $("p-email").textContent = user.email;
            $("name-input").value = user.displayName || "";
            const url = user.photoURL || AVATARS[0];
            $("avatar-big").src = url;
            selectedAvatar = url;
            markSelected(url);
            renderVerify(user);
            $("admin-row").style.display = isAdmin(user) ? "flex" : "none";
            loadFavorites();
            loadHistory();
            loadNotifications();
        });

        // ---- Historial ----
        function epLink(it) {
            return `anime-details.html?id=${it.animeId}&season=${encodeURIComponent(it.season)}&episode=${it.number}`;
        }
        async function loadHistory() {
            try {
                const hist = await listHistory(60);
                $("history-list").innerHTML = hist.length ? hist.map((e) =>
                    `<a class="fav-ep" href="${epLink(e)}"><img src="${e.img}" loading="lazy" alt="">
                        <div><b>${e.animeTitle}</b><br><small>${e.season} · E${e.number} ${e.title || ""}</small></div></a>`).join("")
                    : '<p class="fav-empty">Aún no has visto ningún episodio.</p>';
            } catch (e) { console.error(e); $("history-list").innerHTML = '<p class="fav-empty">No se pudo cargar el historial.</p>'; }
        }

        // ---- Notificaciones (episodios nuevos de animes que sigues/ves) ----
        const MONTHS = { enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6, agosto:7, septiembre:8, octubre:9, noviembre:10, diciembre:11 };
        function parseRelease(str) {
            if (!str) return null;
            const p = String(str).replace(",", "").toLowerCase().split(/\s+/);
            if (p.length === 3 && MONTHS.hasOwnProperty(p[0])) return new Date(+p[2], MONTHS[p[0]], +p[1]);
            const d = new Date(str); return isNaN(d) ? null : d;
        }
        async function loadNotifications() {
            try {
                const [animes, favA, hist] = await Promise.all([getAnimeData(), listFavAnimes(), listHistory(200)]);
                const followed = new Set([...favA.map((a) => a.id), ...hist.map((h) => h.animeId)]);
                if (!followed.size) {
                    $("notif-list").innerHTML = '<p class="fav-empty">Sigue o mira animes (❤️/marcador) para recibir avisos de episodios nuevos.</p>';
                    return;
                }
                const cutoff = Date.now() - 30 * 86400000;
                const notifs = [];
                animes.filter((a) => followed.has(a.id)).forEach((a) => {
                    (a.episodes || []).forEach((ep) => {
                        const dt = parseRelease(ep.releaseDate);
                        if (dt && dt.getTime() >= cutoff) notifs.push({ animeId: a.id, animeTitle: a.title, img: ep.img || a.img, season: ep.season, number: ep.number, title: ep.title, dt });
                    });
                });
                notifs.sort((x, y) => y.dt - x.dt);
                const weekAgo = Date.now() - 7 * 86400000;
                $("notif-count").textContent = notifs.length || "";
                $("notif-list").innerHTML = notifs.length ? notifs.slice(0, 30).map((n) =>
                    `<a class="fav-ep" href="${epLink(n)}"><img src="${n.img}" loading="lazy" alt="">
                        <div><b>${n.animeTitle}</b>${n.dt.getTime() >= weekAgo ? '<span class="notif-new">NUEVO</span>' : ""}<br>
                        <small>Nuevo episodio · ${n.season} · E${n.number} ${n.title || ""}</small></div></a>`).join("")
                    : '<p class="fav-empty">Sin novedades recientes de tus animes.</p>';
            } catch (e) { console.error(e); $("notif-list").innerHTML = '<p class="fav-empty">No se pudieron cargar las notificaciones.</p>'; }
        }

        // ---- Favoritos ----
        document.querySelectorAll(".fav-tab").forEach((t) => t.addEventListener("click", () => {
            document.querySelectorAll(".fav-tab").forEach((x) => x.classList.remove("active"));
            t.classList.add("active");
            $("fav-animes").style.display = t.dataset.fav === "animes" ? "block" : "none";
            $("fav-episodes").style.display = t.dataset.fav === "episodes" ? "block" : "none";
        }));

        async function loadFavorites() {
            try {
                const [animes, eps] = await Promise.all([listFavAnimes(), listFavEpisodes()]);
                $("fav-animes").innerHTML = animes.length ? `<div class="fav-grid">${animes.map((a) =>
                    `<a class="fav-a" href="anime-details.html?id=${a.id}"><img src="${a.img || a.imgMobile || ""}" loading="lazy" alt=""><span>${a.title}</span></a>`).join("")}</div>`
                    : '<p class="fav-empty">Aún no has guardado animes. Usa el botón <i class="far fa-bookmark"></i> en cada anime.</p>';
                $("fav-episodes").innerHTML = eps.length ? eps.map((e) =>
                    `<a class="fav-ep" href="anime-details.html?id=${e.animeId}&season=${encodeURIComponent(e.season)}&episode=${e.number}">
                        <img src="${e.img}" loading="lazy" alt=""><div><b>${e.animeTitle}</b><br><small>${e.season} · E${e.number} ${e.title || ""}</small></div></a>`).join("")
                    : '<p class="fav-empty">Aún no has guardado episodios. Usa el botón <i class="far fa-bookmark"></i> en el reproductor.</p>';
            } catch (e) { console.error(e); }
        }

        // ---- Guardar ----
        $("save-profile").addEventListener("click", async () => {
            const btn = $("save-profile"); btn.disabled = true;
            const msg = $("profile-msg"); msg.textContent = "Guardando…"; msg.className = "msg";
            try {
                await updateUserProfile({
                    displayName: $("name-input").value || currentUser.email.split("@")[0],
                    photoURL: selectedAvatar || currentUser.photoURL || AVATARS[0],
                });
                msg.textContent = "✅ Perfil actualizado."; msg.className = "msg ok";
                $("p-name").textContent = $("name-input").value;
            } catch (e) {
                msg.textContent = "❌ " + e.message; msg.className = "msg error";
            } finally { btn.disabled = false; }
        });

        $("logout-btn").addEventListener("click", async () => { await logoutUser(); location.href = "index.html"; });
    </script>
</body>

</html>
