<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — All-Anime</title>
    <link rel="shortcut icon" href="image/logo.ico">
    <link rel="stylesheet" href="css/index-css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .account-main { padding-top: 120px; min-height: 80vh; }
        .account-main .section-title { margin-bottom: 2.5rem; }
        .account-gate { text-align: center; padding: 8rem 2rem; color: var(--grey-text); font-size: 1.6rem; }
        .account-gate a { color: #ff6b6b; }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo-all-anime.svg" alt="All-Anime Logo" class="logo-desktop">
            <img src="image/all-anime-logo.png" alt="All-Anime Logo Mobile" class="logo-mobile">
        </a>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="explorar.html">Explorar</a></li>
                <li><a href="peliculas.html">Películas</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <div class="search-container">
                <input type="text" placeholder="Buscar..." id="search-input">
                <i class="fas fa-search search-icon" id="search-icon-toggle"></i>
                <div id="search-results" class="search-results-dropdown"></div>
            </div>
            <div id="menu-icon" class="fas fa-bars"></div>
        </div>
    </header>

    <main class="main-content container account-main">
        <h2 class="section-title"><i class="material-icons" style="color:var(--primary-color)">history</i> Historial</h2>
        <div id="account-gate" class="account-gate">Cargando…</div>
        <div id="account-content"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script type="module" src="js/main-2025.js"></script>
    <script type="module">
        import { observeAuth } from "./js/auth.js";
        import { renderHistory } from "./js/account-views.js";
        observeAuth((user) => {
            const gate = document.getElementById("account-gate");
            if (!user) { gate.innerHTML = 'Inicia sesión para ver tu historial. <a href="cuenta.html?redirect=historial.html">Iniciar sesión</a>'; return; }
            gate.style.display = "none";
            renderHistory(document.getElementById("account-content"));
        });
    </script>
    <!-- Adsterra (Social Bar + Popunder) — sólo si el usuario NO compró "sin publicidad" -->
    <script>
    (function(){try{var v=localStorage.getItem("aa_adfree");if(v==="1"||(v&&Date.now()<parseInt(v,10)))return;}catch(e){}
    document.write('<script src="//temptedrecognise.com/cf/a6/75/cfa675a2a58c7c2c579b07801b66706f.js"><\/script>');
    document.write('<script src="//temptedrecognise.com/b6/9b/2a/b69b2a93a6ad48947bfeea27f00c50c8.js"><\/script>');})();
    </script>
</body>

</html>
