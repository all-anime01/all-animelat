<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Anime - All-anime</title>
    <link rel="shortcut icon" href="image/logo.ico">
    <link rel="stylesheet" href="css/index-css.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo-all-anime.svg" alt="All-Anime Logo" class="logo-desktop">
            <img src="image/all-anime-logo.png" alt="All-Anime Logo Mobile" class="logo-mobile">
        </a>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="explorar.html">Explorar</a></li>
                <li><a href="peliculas.html">Películas</a></li>
                </ul>
        </nav>
        <div class="header-right">
            <div class="search-container">
                <input type="text" placeholder="Buscar..." id="search-input">
                <i class="fas fa-search search-icon" id="search-icon-toggle"></i>
                <div id="search-results" class="search-results-dropdown"></div>
            </div>
            <div id="menu-icon" class="fas fa-bars"></div>
        </div>
    </header>

    <section class="anime-detail-hero" id="anime-detail-hero">
    </section>

    <main class="main-content container">
        <section class="episodes-section-detail">
            <div class="section-header-episodes">
                <div class="header-left">
                    <h2 class="section-title">Episodios</h2>
                    <div class="custom-select-wrapper">
                        <select id="season-select"></select>
                    </div>
                </div>
                <div class="header-right-episodes">
                    <div class="episode-search-wrapper">
                        <input type="text" placeholder="Buscar episodio..." id="episode-search">
                        <i class="fas fa-search"></i>
                    </div>
                    <div class="custom-select-wrapper">
                        <select id="sort-episodes">
                            <option value="desc">Más recientes</option>
                            <option value="asc">Más antiguos</option>
                        </select>
                    </div>
                    <div class="view-controls">
                        <button class="view-toggle" id="carousel-view-btn" title="Vista de carrusel"><i
                                class="fas fa-clone"></i></button>
                        <button class="view-toggle active" id="grid-view-btn" title="Vista de cuadrícula"><i
                                class="fas fa-th-large"></i></button>
                        <button class="view-toggle" id="list-view-btn" title="Vista de lista"><i
                                class="fas fa-bars"></i></button>
                    </div>
                </div>
            </div>
            <div class="episodes-container grid" id="episodes-list-container"></div>
            <div class="episodes-showmore-wrap">
                <button id="episodes-show-more" class="btn-show-more-eps" style="display:none;">Mostrar más</button>
            </div>
        </section>

        <section class="card-carousel-section related-section" id="related-section" style="display:none">
            <h2 class="section-title"><i class="material-icons">recommend</i> Contenido similar</h2>
            <div class="card-carousel" id="related-carousel"></div>
        </section>
    </main>

    <div class="trailer-modal" id="trailer-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-trailer-modal">×</button>
            <div class="video-container" id="modal-video-container"></div>
            <div class="modal-info" id="modal-info-content"></div>
        </div>
    </div>

    <div class="episode-player-modal" id="episode-player-modal" data-episode-id="">
        <button class="close-player" id="close-player-modal" title="Cerrar (Esc)">×</button>
        <div class="player-video-container">
            <iframe id="episode-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            <button class="player-fs-btn" id="player-fs-btn" type="button" title="Pantalla completa (muestra el conteo del siguiente episodio)"><i class="fas fa-expand"></i></button>
        </div>
        <div class="player-details-container">
            <div class="player-details-content">
                <div class="player-main-info-col">
                    <img id="player-poster" class="player-poster" alt="" loading="lazy">
                    <a href="#" id="player-anime-link">
                        <h3 id="player-anime-title"></h3>
                    </a>
                    <h4 id="player-episode-title"></h4>
                    <div class="player-meta-tags" id="player-episode-meta">
                    </div>
                    <p id="player-episode-description"></p>
                    <div class="episode-actions" id="player-episode-actions">
                    </div>
                    <!-- Comentarios propios (Firestore) — ver js/engagement.js -->
                    <div id="episode-comments"></div>
                </div>
                <div class="player-nav-col">
                    <div class="player-nav-previews">
                        <div id="player-next-episode-preview">
                        </div>
                        <div id="player-prev-episode-preview">
                        </div>
                    </div>
                    <button class="player-nav-more" id="player-see-episodes" type="button">
                        <i class="fas fa-layer-group"></i> Ver más episodios
                    </button>
                    <div class="player-eplist" id="player-episode-list-panel" hidden></div>
                </div>
            </div>
        </div>
    </div>


    <footer class="footer">
        <div class="container">
            <p><span>Anime HD Online</span> - Ningún vídeo se encuentra alojado en nuestros servidores.</p>
            <nav class="footer-nav">
                <a href="#">Términos y Condiciones</a>
                <a href="#">Política de Privacidad</a>
                <a href="#">Sobre all-anime</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script type="module" src="js/main-2025.js"></script>
    <!-- Adsterra (Social Bar + Popunder) — sólo si el usuario NO compró "sin publicidad" -->
    <script>
    (function(){try{var v=localStorage.getItem("aa_adfree");if(v==="1"||(v&&Date.now()<parseInt(v,10)))return;}catch(e){}
    document.write('<script src="//temptedrecognise.com/cf/a6/75/cfa675a2a58c7c2c579b07801b66706f.js"><\/script>');
    document.write('<script src="//temptedrecognise.com/b6/9b/2a/b69b2a93a6ad48947bfeea27f00c50c8.js"><\/script>');})();
    </script>
</body>

</html>
