plugins {
    id 'com.android.application'
}

android {
    namespace 'net.allanime.tv'
    compileSdk 36

    defaultConfig {
        applicationId "net.allanime.tv"
        minSdk 21          // Fire TV / Android TV antiguos
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // Dos apps desde el mismo código: 'mobile' (Android teléfono/tablet, cualquier
    // orientación) y 'tv' (Fire TV / Android TV, horizontal). Pueden convivir en el
    // mismo dispositivo (applicationId distinto).
    flavorDimensions += "device"
    productFlavors {
        mobile {
            dimension "device"
            applicationIdSuffix ".mobile"
            manifestPlaceholders = [orientation: "unspecified", appName: "All-Anime"]
        }
        tv {
            dimension "device"
            manifestPlaceholders = [orientation: "landscape", appName: "All-Anime TV"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Sin dependencias extra: usa WebView y Activity del framework (theme nativo
    // fullscreen). Ligero y compatible con Fire TV.
}
