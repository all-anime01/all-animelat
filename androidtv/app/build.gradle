plugins {
    id 'com.android.application'
}

android {
    namespace 'net.allanime.tv'
    compileSdk 36

    defaultConfig {
        applicationId "net.allanime.tv"
        minSdk 21          // Fire TV / Android TV / Google TV antiguos
        targetSdk 36
        // SUBIR versionCode en CADA cambio → al instalar la nueva APK (misma firma
        // debug) se ACTUALIZA en sitio, sin desinstalar. versionName es informativo.
        versionCode 2
        versionName "1.1"
    }

    // Dos apps desde el mismo código: 'mobile' (Android teléfono/tablet, cualquier
    // orientación) y 'tv' (Fire TV / Android TV, horizontal). Pueden convivir en el
    // mismo dispositivo (applicationId distinto).
    flavorDimensions += "device"
    productFlavors {
        mobile {
            dimension "device"
            applicationIdSuffix ".mobile"
            manifestPlaceholders = [orientation: "unspecified", appName: "All-Anime"]
            // Móvil NO se marca como TV → el sitio NO activa la barra lateral de Fire TV.
            buildConfigField "boolean", "IS_TV", "false"
        }
        tv {
            dimension "device"
            manifestPlaceholders = [orientation: "landscape", appName: "All-Anime"]
            buildConfigField "boolean", "IS_TV", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Sin dependencias extra: usa WebView y Activity del framework (theme nativo
    // fullscreen). Ligero y compatible con Fire TV.
}
